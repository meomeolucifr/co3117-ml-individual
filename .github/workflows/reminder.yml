# Opens a reminder issue assigned to the student (GitHub then e-mails them): every Monday, and on
# Thursday only when a deadline is close or there has been no commit for four days.
# One short run per reminder; the repository is private, so it stays inside the Actions minutes.
# Do not edit this file: the instructor compares .github/ with the released version.

name: commit-reminder

on:
  schedule:
    - cron: "0 2 * * 1,4"      # 09:00 Asia/Ho_Chi_Minh on Monday and Thursday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
          fetch-tags: true
      - run: pip install --quiet pyyaml
      - name: Reminder
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Ho_Chi_Minh
          ASSIGNEE: "meomeolucifr"          # set per repository by the instructor's push script
        run: python .github/scripts/remind.py
