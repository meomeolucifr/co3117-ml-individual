# Runs tools/check.py when a checkpoint tag is pushed. It does not run on every push or on
# demand: one run per checkpoint keeps the whole class inside the organisation's monthly
# Actions minutes. Run the same check locally, as often as you like, with `python tools/check.py`.
# Do not edit this file, tools/ or tests/contract/: the instructor compares them with the released version.

name: checkpoint-check

on:
  push:
    tags: ["w[0-9][0-9]", "w08-midterm", "release-baseline", "part1-final", "part2-final"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install --quiet -r requirements.txt
      - name: Self-check
        env:
          TZ: Asia/Ho_Chi_Minh
          PYTHONHASHSEED: "0"
          CO3117_CHECKPOINT: ${{ github.ref_name }}
        run: python tools/check.py --json check-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-result
          path: check-result.json
          retention-days: 90
