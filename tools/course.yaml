# CO3117 HK261: course calendar and checkpoint rules.
# The self-check (tools/check.py) and the instructor's tools read this file.
# The instructor's copy is authoritative; editing your copy changes only your local self-check.
#
# Times are Asia/Ho_Chi_Minh (UTC+7). A weekly tag is normally due before the next class; w05,
# release-baseline, hw1, hw2, hw3 are all due on 7 Oct because the repositories were issued on 2 Oct.

timezone: "+07:00"
release_date: "2026-09-23"          # Course Week 5, calendar week 39

weeks:
  # week: [class date, tag name, tag due (local time), topic]
  W05: {date: "2026-09-23", tag: "w05", due: "2026-10-07T07:00", topic: "Perceptron, Delta Rule & Neural Networks (ANN)"}
  W06: {date: "2026-09-30", tag: "w06", due: "2026-10-14T07:00", topic: "Bayesian learning / Naive Bayes"}
  W07: {date: "2026-10-07", tag: "w07", due: "2026-10-14T23:59", topic: "Genetic Algorithms & Bayesian Networks (TAN), Part I closeout"}
  W08: {date: "2026-10-16", tag: "w08-midterm", due: "2026-10-19T23:59", topic: "MIDTERM (16 Oct): compact entry, timed rehearsal, reflection after the exam"}
  W09: {date: "2026-10-21", tag: "w09", due: "2026-10-28T07:00", topic: "HMM / sequence modelling"}
  W10: {date: "2026-10-28", tag: "w10", due: "2026-11-04T07:00", topic: "SVM: maximum and soft margin"}
  W11: {date: "2026-11-04", tag: "w11", due: "2026-11-11T07:00", topic: "Kernel SVM, cross-model comparison"}
  W12: {date: "2026-11-11", tag: "w12", due: "2026-11-18T07:00", topic: "PCA, curse of dimensionality"}
  W13: {date: "2026-11-18", tag: "w13", due: "2026-11-25T07:00", topic: "LDA, feature engineering"}
  W14: {date: "2026-11-25", tag: "w14", due: "2026-12-02T07:00", topic: "Bagging, boosting, AdaBoost"}
  W15: {date: "2026-12-02", tag: "w15", due: "2026-12-09T07:00", topic: "Generative vs discriminative, Logistic/MaxEnt, CRF, synthesis"}

# R0 setup gate (not graded). The specification puts it before the W06 class; it is moved
# to 7 Oct, together with w05, because the course repositories are issued on 2 Oct.
gates:
  release-baseline: {due: "2026-10-07T07:00", week: W05}

# Tags for the two graded parts. part2-final is due two calendar days before the official final exam.
parts:
  part1-final: {due: "2026-10-14T23:59", week: W07}
  part2-final: {due: null, week: W15}   # set when the final exam date is published

# Handwritten homework sets (separate from the weekly drill). One set per Part I topic; the problem
# sheets are in homework/ and on the course LMS. Submit ONE scanned PDF, homework/hwN-submission.pdf
# (5 MB at most), then push the tag hwN; the time GitHub receives the tag is the submission time.
# No worked solutions are published; students self-check using course materials and AI assistants
# (recorded in AI_USE.md). Corrections, if any, go in homework/hwN-corrections.md and never replace
# the submission. Formative practice reviewed under the Written-exam portfolio criterion
# (assignment Section 11, criterion 3); no conversion of the set scores to points is published.
homework:
  hw1: {due: "2026-10-07T07:00", week: W05, release: null, topic: "Foundations: workflow, evaluation, generalisation"}
  hw2: {due: "2026-10-07T07:00", week: W05, release: null, topic: "Decision trees"}
  hw3: {due: "2026-10-07T07:00", week: W05, release: null, topic: "Artificial neural networks"}
  hw4: {due: "2026-10-14T23:59", week: W07, release: null, topic: "Bayesian learning and Bayesian networks"}
  hw5: {due: "2026-10-14T23:59", week: W07, release: null, topic: "Genetic algorithms"}

# Depth-A components under tests/contract. A component is REQUIRED from the week listed;
# before that week an unimplemented stub is skipped, from that week on it fails.
components:
  tree_split: W05       # release catch-up: one impurity/split routine
  perceptron: W05
  mlp: W05
  naive_bayes: W06
  hmm: W09
  pca: W12
  logistic: W15

# Files every checkpoint must contain (paths relative to the repository root).
required_files:
  always: [README.md, PROGRESS.md, MODEL_LOG.md, AI_USE.md, REFERENCES.md, protocol.yaml, requirements.txt, data/README.md, docs/index.md]
  release-baseline: [docs/pre-release/PRE_RELEASE_CATCHUP.md]
  part1-final: [SUBMISSION_PART1.md, report/part1_summary.pdf, exam/a4-notes-part1-midterm.pdf]
  part2-final: [SUBMISSION_PART2.md, report/part2_final_report.pdf, exam/a4-notes-part2-final.pdf, exam/mock-final-first-attempt.pdf, exam/mock-final-corrections.md, exam/midterm-reflection.md]

limits:
  max_file_mb: 5
  post_words: {catchup: [500, 900], weekly: [350, 700]}
  forbidden_globs: ["*.zip", "*.tar.gz", "*.pkl", "*.joblib", "*.npy", "*.npz", "*.h5", "*.pt", "*.ckpt", "data/raw/**", "data/UCI*/**", ".env", "*.pem", "*.key"]
